services:
  db:
    image: mongo:7
    restart: unless-stopped
    # Host port 27017 is reserved for the locally installed MongoDB service.
    # The backend container reaches this database over the internal network (db:27017),
    # so exposing it on the host is not required.
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    build: ./backend
    restart: "no"
    command: npm run db:init
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 27017
      DB_NAME: learnova
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 27017
      DB_NAME: learnova
      JWT_SECRET: docker-dev-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
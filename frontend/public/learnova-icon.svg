<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f5bff"/>
      <stop offset="1" stop-color="#6c2bd9"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b0f8"/>
      <stop offset="1" stop-color="#7a4be0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c2bd9"/>
      <stop offset="1" stop-color="#3b1a78"/>
    </linearGradient>
    <linearGradient id="bead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ab8"/>
      <stop offset="1" stop-color="#e84b7a"/>
    </linearGradient>
  </defs>

  <!-- mortarboard: cap board -->
  <polygon points="256,228 362,304 256,380 150,304" fill="url(#board)"/>
  <polygon points="256,238 348,304 256,370 164,304" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- mortarboard: skull cap base -->
  <path d="M210 380 L302 380 L284 424 L228 424 Z" fill="url(#base)"/>

  <!-- mortarboard: center button -->
  <circle cx="256" cy="304" r="13" fill="#8f5bff" stroke="#ffffff" stroke-width="4"/>

  <!-- tassel cord -->
  <path d="M268 314 C326 328 366 344 392 372" fill="none" stroke="#b294ff" stroke-width="10" stroke-linecap="round"/>
  <!-- tassel bead -->
  <circle cx="404" cy="396" r="16" fill="url(#bead)"/>

  <!-- open book pages -->
  <path d="M256 418 C216 412 168 402 130 394 C122 392 114 398 114 410 L124 486 C124 496 134 500 142 492 C184 470 234 466 256 492 Z" fill="url(#pages)"/>
  <path d="M256 418 C296 412 344 402 382 394 C390 392 398 398 398 410 L388 486 C388 496 378 500 370 492 C328 470 278 466 256 492 Z" fill="url(#pages)"/>
  <!-- page separation line -->
  <path d="M256 420 L256 490" stroke="#3b1a78" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

  <!-- nova sparkles -->
  <path d="M384,96 L394,164 L462,178 L394,192 L384,260 L374,192 L306,178 L374,164 Z" fill="#8f5bff"/>
  <path d="M140,132 L145,160 L196,164 L145,168 L140,196 L135,168 L84,164 L135,160 Z" fill="#b294ff"/>
</svg>